<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#141815">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <title>GAVIÃO · Depois do sinal</title>
</head>
<body>
  <main id="app">
    <div class="play-layout">
      <div id="viewport">
        <div id="game" tabindex="0" aria-label="Área do jogo. WASD ou setas movem, Shift corre, J soco, K chute, L defende, G agarra."></div>
        <p id="loading" role="status">Abrindo o corredor…</p>
        <div class="overlay-top">
          <button id="play" type="button">Jogar</button>
          <button id="menu-btn" type="button" aria-expanded="false" aria-controls="menu" title="Menu">☰</button>
        </div>
        <span id="status" role="status"></span>
      </div>
      <div id="touch-controls" class="touch-controls" aria-label="Controles de toque">
        <div id="dpad" class="dpad" role="group" aria-label="Direcional"><span data-dir="up">↑</span><span data-dir="left">←</span><span class="pad-center">+</span><span data-dir="right">→</span><span data-dir="down">↓</span></div>
        <div class="touch-actions">
          <button type="button" data-action="run">Correr</button><button type="button" data-action="guard">Defender</button><button type="button" data-action="grab">Agarrar</button>
          <button type="button" class="strike" data-action="attack">Soco</button><button type="button" class="strike" data-action="kick">Chute</button><button type="button" id="touch-pause">Pausa</button>
        </div>
      </div>
    </div>
    <div id="menu" class="menu" hidden>
      <div class="menu-panel" role="dialog" aria-label="Menu">
        <div class="menu-grid">
          <label>Modo<select id="game-mode"><option value="corridor">Corredor</option><option value="duel">Duelo 1×1</option></select></label>
          <label>Lutador<select id="fighter"><option value="sorriso">Sorriso</option><option value="miguel">Miguel</option></select></label>
          <label class="corridor-only">Treino<select id="training"><option value="reaction">Reações</option><option value="guard">Defesa do alvo</option><option value="sparring">Combate</option></select></label>
          <label class="corridor-only">Miguel<select id="miguel-pose"><option value="idle">Idle</option><option value="guard">Guarda</option></select></label>
        </div>
        <div class="menu-buttons">
          <button id="reset" type="button">Reiniciar</button><button id="debug" type="button" aria-pressed="false">Colisões</button><button id="blood" type="button" aria-pressed="true">Sangue: sim</button><button id="audio" type="button" aria-pressed="true">Som: sim</button><button id="toggle-touch" type="button" aria-pressed="false">Toque</button>
        </div>
        <dl class="keys">
          <dt>J</dt><dd>soco · frente/baixo/trás mudam o golpe</dd>
          <dt>K</dt><dd>chute · cima alto · baixo na perna</dd>
          <dt>L</dt><dd>defesa · no último instante apara; J contra-ataca</dd>
          <dt>G</dt><dd>agarra · depois de 2 golpes, arremessa</dd>
          <dt>Chão</dt><dd>J/K perto de quem caiu</dd>
          <dt>Shift</dt><dd>corre · Shift+J pesado</dd>
          <dt>Esc · R</dt><dd>pausa · reinicia</dd>
        </dl>
        <button id="menu-close" type="button">Voltar ao jogo</button>
      </div>
    </div>
  </main>
  <script src="vendor/phaser.min.js"></script>
  <script type="module" src="src/main.js?v=080-duelo"></script>
  <noscript>Ative JavaScript para jogar GAVIÃO.</noscript>
</body>
</html>
