[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json,*.wav,*.ttf,capitulo1/mapa/*.txt,capitulo1/assets/sons/CREDITOS.md,capitulo1/assets/sons/procedencia/*.md"
exclude_filter="tools/*,tests/*,web/*,capitulo1/assets/definitivos/*/tripo_convert_*.fbx,capitulo1/assets/definitivos/*/*_mixamo.fbx"
export_path="web/index.html"
script_export_mode=1

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=false
html/custom_html_shell=""
html/head_include="<meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover'><link rel='icon' href='data:,'><style>html,body,canvas{touch-action:none;overscroll-behavior:none;}</style>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
